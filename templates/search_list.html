<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      width: 680px;
      color: #263f4b;
      background: #d9eef1;
      font-family: "MomoTuneWenKai", "MiSans", sans-serif;
    }
    .canvas {
      position: relative;
      overflow: hidden;
      min-height: 170px;
      padding: 28px 30px 25px;
      background:
        radial-gradient(circle at 8% -5%, rgba(255, 189, 171, .72) 0 15%, transparent 15.5%),
        radial-gradient(circle at 100% 100%, rgba(130, 202, 198, .5) 0 25%, transparent 25.5%),
        linear-gradient(135deg, #dff4f4 0%, #fffaf1 49%, #ffe4d5 100%);
    }
    .canvas::before {
      content: "";
      position: absolute;
      top: -126px;
      right: -84px;
      width: 300px;
      height: 300px;
      border: 1px solid rgba(235, 145, 111, .28);
      border-radius: 50%;
      box-shadow: 0 0 0 16px rgba(235, 145, 111, .1), 0 0 0 34px rgba(235, 145, 111, .065), 0 0 0 54px rgba(235, 145, 111, .035);
    }
    .canvas::after {
      content: "";
      position: absolute;
      left: -122px;
      bottom: -176px;
      width: 330px;
      height: 330px;
      border-radius: 50%;
      border: 1px solid rgba(60, 151, 156, .16);
      box-shadow: 0 0 0 16px rgba(60, 151, 156, .08), 0 0 0 34px rgba(60, 151, 156, .05), 0 0 0 52px rgba(60, 151, 156, .035);
    }
    .topline { position: relative; display: flex; align-items: center; justify-content: space-between; }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #e17268;
      font-family: "MomoTuneWenKai", "MiSans", sans-serif;
      font-size: 12px;
      letter-spacing: .23em;
      text-transform: uppercase;
    }
    .brand-mark {
      position: relative;
      width: 24px;
      height: 24px;
      border: 2px solid #e48176;
      border-radius: 50%;
      background: rgba(255, 255, 255, .56);
      box-shadow: inset 0 0 0 4px rgba(228, 129, 118, .12);
    }
    .brand-mark::after { content: ""; position: absolute; top: 6px; left: 6px; width: 8px; height: 8px; border-radius: 50%; background: #e48176; }
    .status { padding: 5px 10px; border: 1px solid rgba(70, 144, 151, .32); border-radius: 99px; color: #397d86; background: rgba(255, 255, 255, .58); font-size: 11px; }
    .hero { position: relative; display: flex; align-items: flex-end; justify-content: space-between; margin: 26px 0 21px; }
    .eyebrow { margin: 0 0 5px; color: #df786d; font-size: 12px; letter-spacing: .12em; }
    .title { margin: 0; color: #263f4b; font-size: 32px; font-weight: 700; line-height: 1.15; letter-spacing: .05em; text-shadow: 0 3px 0 rgba(255, 255, 255, .72); }
    .jp { margin: 7px 0 0; color: #5c8990; font-size: 13px; letter-spacing: .12em; }
    .record {
      position: relative;
      width: 104px;
      height: 104px;
      margin: 0 26px 1px 0;
      padding: 4px;
      border: 1px solid rgba(40, 71, 79, .32);
      border-radius: 50%;
      background: #f9fcf7;
      box-shadow: 0 14px 26px rgba(42, 95, 102, .2), 0 0 0 7px rgba(255, 255, 255, .32);
    }
    .record-cover { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; filter: saturate(1.08) contrast(1.04); }
    .record::before {
      content: "";
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(255, 255, 255, .8);
      border-radius: 50%;
      box-shadow: 0 0 0 7px rgba(32, 62, 70, .13), 0 0 0 14px rgba(255, 255, 255, .18), 0 0 0 21px rgba(32, 62, 70, .1);
      pointer-events: none;
    }
    .record::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 16px;
      border: 4px solid #fffaf1;
      border-radius: 50%;
      background: #e47668;
      box-shadow: 0 1px 5px rgba(37, 69, 77, .32);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .list { position: relative; display: grid; gap: 9px; }
    .song-row {
      display: flex;
      align-items: center;
      min-height: 82px;
      padding: 10px 13px 10px 11px;
      border: 1px solid rgba(224, 139, 119, .42);
      border-radius: 17px;
      background: rgba(255, 255, 255, .72);
      box-shadow: 0 8px 18px rgba(56, 104, 109, .1), inset 0 1px rgba(255, 255, 255, .86);
    }
    .index {
      display: grid;
      width: 30px;
      height: 30px;
      margin-right: 9px;
      place-items: center;
      border: 1px solid rgba(224, 126, 111, .56);
      border-radius: 11px;
      color: #d96e64;
      background: #fff0e7;
      font-size: 16px;
      font-weight: 700;
    }
    .cover {
      width: 60px;
      height: 60px;
      margin-right: 14px;
      border: 2px solid rgba(255, 255, 255, .94);
      border-radius: 15px;
      object-fit: cover;
      background: #c9e8e5;
      box-shadow: 0 6px 12px rgba(57, 112, 117, .18);
    }
    .song-info { min-width: 0; flex: 1; }
    .song-name { overflow: hidden; color: #294651; font-size: 17px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .song-artist { overflow: hidden; margin-top: 4px; color: #5f8588; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .song-album { overflow: hidden; margin-top: 2px; color: #8da7a4; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .duration { margin-left: 10px; color: #739295; font-size: 12px; white-space: nowrap; }
    .source { margin-left: 10px; padding: 4px 8px; border: 1px solid rgba(211, 113, 98, .34); border-radius: 8px; color: #bd5f57; background: #fff0e7; font-size: 9px; font-weight: 700; letter-spacing: .1em; }
    .footer { position: relative; display: flex; align-items: center; justify-content: space-between; margin: 17px 3px 0; color: #6e9292; font-size: 12px; }
    .footer::before { content: ""; width: 28px; height: 1px; margin-right: 9px; background: #e68778; box-shadow: 7px 0 #e68778, 14px 0 #e68778; }
    .footer-text { flex: 1; }
    .footer-mark { color: #dd7569; font-size: 11px; letter-spacing: .17em; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="topline">
      <div class="brand"><span class="brand-mark"></span><span>MOMOTUNE</span></div>
      <span class="status">NOW PLAYING</span>
    </div>
    <section class="hero">
      <div>
        <p class="eyebrow">MUSIC SELECTOR</p>
        <h1 class="title">{{TITLE}}</h1>
        <p class="jp">好きな音を、そっと。</p>
      </div>
      <div class="record"><img class="record-cover" src="{{HERO_COVER}}" alt="" /></div>
    </section>
    <section class="list">{{ROWS}}</section>
    <footer class="footer"><span class="footer-text">{{HINT}}</span><span class="footer-mark">MUSIC / 01</span></footer>
  </main>
</body>
</html>
